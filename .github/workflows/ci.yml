name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  migrations:
    # Runs the migrations, the seed and the evidence rules against a real
    # Postgres. No Supabase project needed: supabase/test/supabase_stubs.sql
    # stands in for the auth and storage schemas.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the generated seed matches the starter kit
        run: |
          npm run seed:generate
          git diff --exit-code supabase/seed.sql

      - name: Apply migrations and check the schema rules
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./scripts/test-migrations.sh
